</style></head><body><div id="root"></div><div class="preview-banner">DESIGN PREVIEW · Sample records · The replacement source files connect to your existing API.</div><script>
const previewRecords={"case": {"id": 1, "orderNumber": "ORD-1001", "subject": "Order has not arrived", "description": "My order was due yesterday, but it hasn't arrived."}, "order": {"orderNumber": "ORD-1001", "status": "Delayed", "promisedDeliveryDate": "2026-11-22", "revisedDeliveryDate": "2026-11-24", "delayReason": "Parcel delayed at the regional depot."}, "alerts": [{"notation": "FSA-AA-54-2026", "title": "Healthy Fit recalls Vegan Protein Bar Hazelnut Nougat because of undeclared peanuts", "description": "Healthy Fit is recalling Vegan Protein Bar Hazel Nougat because it contains peanuts which are not mentioned on the label.", "alertUrl": "https://alerts.food.gov.uk/news-alerts/alert/fsa-aa-54-2026", "modified": "2026-11-23T10:40:07.685+00:00"}]};
window.fetch=async function(input){
const address=typeof input==='string'?input:input.url;
const url=new URL(address,'https://casepilot-preview.example');
let data;
if(url.pathname==='/api/cases/1') data=previewRecords.case;
else if(url.pathname==='/api/orders/ORD-1001') data=previewRecords.order;
else if(url.pathname==='/api/alerts') {const q=(url.searchParams.get('query')||'').trim().toLowerCase();data=previewRecords.alerts.filter(a=>[a.notation,a.title,a.description||''].join(' ').toLowerCase().includes(q));}
else return new Response(JSON.stringify({title:'Preview record not found'}),{status:404,headers:{'Content-Type':'application/json'}});
return new Response(JSON.stringify(data),{status:200,headers:{'Content-Type':'application/json'}});
};
